# Trust user certificates signed by the OpenBao SSH CA.
# Loaded before 50-redhat.conf, and sshd uses the first value it sees.
TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Logs the certificate key ID, serial and signing CA for each login
LogLevel VERBOSE
SyslogFacility AUTHPRIV
